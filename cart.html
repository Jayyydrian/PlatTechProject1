<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="cart.css">
    <link rel="stylesheet" href="../includes/footer.css">
    <link rel="stylesheet" href="../includes/navbar.css">
</head>
<body>

    <div id="navbar"></div>

    <!-- Breadcrumb -->
    <div class="breadcrumb">
        <a href="Homepage.html">Home</a><span>></span>
        <span>Shopping Cart</span>
    </div>

    <div class="cart-container">
        <h1>Your Cart</h1>
        
        <div class="cart-content">
            <div class="cart-items" id="cart-items">
                <!-- Cart items will be added here dynamically -->
            </div>
            
            <!-- Empty cart message -->
            <div class="empty-cart" id="cart-empty-message">
                <i class="fas fa-shopping-cart"></i>
                <p>Your cart is empty</p>
                <a href="shop.html" class="continue-shopping-btn" id="continue-shopping-btn">Continue Shopping</a>
            </div>
            
            <div class="cart-summary" id="cart-summary-section">
                <h2>Order Summary</h2>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="cart-subtotal">₱0.00</span>
                </div>
                <div class="summary-row">
                    <span>Shipping</span>
                    <span id="cart-shipping">₱0.00</span>
                </div>
                <div class="summary-row total">
                    <span>Total</span>
                    <span id="cart-total">₱0.00</span>
                </div>
                
                <div class="promo-code">
                    <input type="text" placeholder="Promo Code">
                    <button>Apply</button>
                </div>
                
                <div class="buttons-container">
                    <button id="checkout-btn" class="checkout-btn">Proceed to Checkout</button>
                    <a href="shop.html" class="continue-shopping">Continue Shopping</a>
                </div>
                
                <div class="payment-methods">
                    <p>We accept:</p>
                    <div class="payment-icons">
                        <i class="fab fa-cc-visa"></i>
                        <i class="fab fa-cc-mastercard"></i>
                        <i class="fab fa-cc-amex"></i>
                        <i class="fab fa-cc-paypal"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Chat Button -->
    <button class="chat-button">
        <i class="fas fa-comment"></i>
    </button>

    <div id="footer"></div>
  
    <!-- JAVASCRIPT -->
    <script src="cart.js" type="module"></script>
    <script>
        // Load the navbar
        fetch('../includes/navbar.html')
          .then(res => res.text())
          .then(data => document.getElementById('navbar').innerHTML = data);
      
        // Load the footer
        fetch('../includes/footer.html')
          .then(res => res.text())
          .then(data => document.getElementById('footer').innerHTML = data);
    </script>
</body>
</html>
