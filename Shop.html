<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - Motoworld</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="Shop.css">
    <link rel="stylesheet" href="../includes/footer.css">
    <link rel="stylesheet" href="../includes/navbar.css">
</head>
<body>
    <div id="navbar"></div>

    <!-- Hero Section -->
    <div class="hero-section">
        <h1>Find Your Perfect Gear</h1>
        <p>Quality motorcycle gear for every rider</p>
    </div>

    <!-- Filter Section -->
    <div class="filter-section">
        <div class="filter-container">
            <div class="filter-group">
                <label for="category-filter">Category</label>
                <select id="category-filter">
                    <option value="all">All Categories</option>
                    <option value="Helmet">Helmets</option>
                    <option value="Apparel">Apparel</option>
                    <option value="Gloves">Gloves</option>
                    <option value="Parts">Parts</option>
                    <option value="Accessories">Accessories</option>
                    <option value="Maintenance">Maintenance</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="brand-filter">Brands</label>
                <select id="brand-filter">
                    <option value="all">All Brands</option>
                    <option value="O'Neal">O'Neal</option>
                    <option value="Alpinestars">Alpinestars</option>
                    <option value="Dainese">Dainese</option>
                    <option value="Fox Racing">Fox Racing</option>
                    <option value="Shoei">Shoei</option>
                    <option value="AGV">AGV</option>
                    <option value="Rev'it">Rev'it</option>
                    <option value="HJC">HJC</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label for="sort-by">Sort By</label>
                <select id="sort-by">
                    <option value="featured">Featured</option>
                    <option value="price-low">Price: Low to High</option>
                    <option value="price-high">Price: High to Low</option>
                    <option value="name-asc">Name: A to Z</option>
                    <option value="name-desc">Name: Z to A</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Products Grid -->
    <div class="products-container">
        <div class="products-grid" id="products-grid">
            <!-- Products will be loaded dynamically here -->
        </div>
    </div>

    <!-- Pagination -->
    <div class="pagination" id="pagination">
        <!-- Pagination will be added dynamically if needed -->
    </div>

    <!-- Chat Button -->
    <button class="chat-button">
        <i class="fas fa-comment"></i>
    </button>

    <div id="footer"></div>

    <!-- JAVASCRIPT -->
    <script src="products.js" type="module"></script>
    <script src="shop.js" type="module"></script>
    <script>
        // Load the navbar
        fetch('../includes/navbar.html')
          .then(res => res.text())
          .then(data => document.getElementById('navbar').innerHTML = data);
      
        // Load the footer
        fetch('../includes/footer.html')
          .then(res => res.text())
          .then(data => document.getElementById('footer').innerHTML = data);
    </script>
</body>
</html>
