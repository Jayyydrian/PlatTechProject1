<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile - ST Motor & Gear</title>
  <link href="profile.css" rel="stylesheet"> <!-- Link to profile.css -->
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header>
    <h1>ST Motor & Gear</h1>
    <p>Your one-stop shop for all things motorcycling!</p>
  </header>

  <nav>
    <a href="homepage.html">Home</a>
    <a href="#">Categories</a>
    <a href="profile.html">
      <i class="fas fa-user"></i> 
    </a>
    <a href="#">Contact</a>
  </nav>
  

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card">
          <div class="card-body text-center">
            <h2>Welcome to Your Profile</h2>
            <div class="button-container">
              <button class="btn btn-primary" onclick="location.href='orders.html'">View Orders</button>
              <button class="btn btn-secondary" onclick="location.href='previous-orders.html'">Previous Orders</button>
              <button class="btn btn-success" onclick="location.href='cart.html'">View Cart</button>
              <button class="btn btn-info" onclick="location.href='edit-profile.html'">Edit Profile</button>
              <button class="btn btn-warning" onclick="location.href='settings.html'">Settings</button>
              <button class="btn btn-danger" id="logout-button">Logout</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2025 ST Motor & Gears </p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Logout functionality
    document.getElementById("logout-button").addEventListener("click", function() {
      localStorage.removeItem("isLoggedIn"); // Remove login status
      window.location.href = "homepage.html"; // Redirect to homepage
    });
  </script>
</body>
</html>
