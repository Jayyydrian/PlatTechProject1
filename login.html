<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ST Motor & Gear</title>
  <link href="Homepage.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <nav id="main-nav" class="navbar navbar-dark bg-dark fixed-top">
    <div class="container">
      <h1 class="navbar-brand mb-0">ST Motor &amp; Gear</h1>
      <div>
        <a class="nav-link d-inline text-white" href="Homepage.html">Home</a>
        <a class="nav-link d-inline text-white" href="#">Categories</a>
        <a class="nav-link d-inline text-white" href="#">Contact</a>
        <a class="nav-link d-inline text-warning fw-bold" href="login.html">Login</a>
      </div>
    </div>
  </nav>

  <div class="container login-container">
    <div class="card login-card shadow-lg">
      <div class="card-body">
        <h2 class="text-center mb-4">Welcome Back, Rider 🏍️</h2>
        <form id="login-form">
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
          </div>
          <button type="submit" class="btn btn-warning w-100">Login</button>
        </form>
        <div class="mt-3 text-center">
          <p>Don't have an account? <a href="register.html" class="link-warning fw-bold">Register here</a></p>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer bg-dark text-white text-center py-3 mt-5">
    <p>&copy; 2025 ST Motor & Gear</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="login.js"></script>
</body>
</html>
