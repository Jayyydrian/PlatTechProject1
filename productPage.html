<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Motoworld</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="ProductDescription.css">
    <link rel="stylesheet" href="../includes/footer.css">
    <link rel="stylesheet" href="../includes/navbar.css">
</head>
<body>

    <div id="navbar"></div>

    <!-- Breadcrumb -->
    <div class="breadcrumb">
        <a href="Shop.html">Shop</a><span>></span>
        <a href="#" id="category-link">Category</a><span>></span>
        <span id="product-name">Product Name</span>
    </div>

    <!-- Product Container -->
    <div class="product-container">
        <!-- Product Images Section -->
        <div class="product-images">
            <div class="main-image">
                <img id="main-product-image" src="" alt="Product Image">
                <div class="discount-badge" id="discount-badge"></div>
            </div>
            <div class="additional-images" id="additional-images">
                <!-- Additional images will be added here dynamically -->
            </div>
        </div>

        <!-- Product Details Section -->
        <div class="product-details">
            <div class="contact-info">
                <h3>Speak to one of our Agents:</h3>
                <a href="tel:09178842345"><i class="fas fa-phone"></i> 09178842345</a>
                <a href="mailto:email@motoworld.com"><i class="fas fa-envelope"></i> Email Us</a>
            </div>

            <h1 class="product-title" id="product-title">Product Title</h1>
            
            <div class="price-container">
                <span class="current-price" id="current-price">₱0.00</span>
                <span class="original-price" id="original-price">₱0.00</span>
            </div>

            <div class="rating">
                <div class="stars" id="rating-stars">
                    <!-- Stars will be added dynamically -->
                </div>
                <span class="review-count" id="review-count">0 (0 Reviews)</span>
            </div>

            <div class="product-description" id="product-description">
                <!-- Product description will be added here -->
            </div>

            <div class="options-section">
                <h3>Color</h3>
                <div class="color-options" id="color-options">
                    <!-- Color options will be added dynamically -->
                </div>

                <h3>Size</h3>
                <div class="size-options" id="size-options">
                    <!-- Size options will be added dynamically -->
                </div>
            </div>

            <div class="quantity-section">
                <div class="quantity-controls">
                    <button class="quantity-btn decrease">-</button>
                    <input type="text" class="quantity-input" value="1" readonly>
                    <button class="quantity-btn increase">+</button>
                </div>
                <button class="add-to-cart-btn">Add to cart</button>
            </div>

            <button class="buy-now-btn">Buy it now</button>

            <div class="pickup-info">
                <p>
                    <i class="fas fa-check"></i>
                    <span>
                        <span class="pickup-location" id="pickup-location">Pickup location</span><br>
                        <span class="pickup-time" id="pickup-time">Pickup time</span><br>
                        <a href="#" class="store-info-link">View store information</a>
                    </span>
                </p>
            </div>

            <div class="shipping-banner">
                <div class="shipping-icon">
                    <i class="fas fa-motorcycle"></i>
                </div>
                <div class="shipping-info">
                    <h4>Shipping Discount</h4>
                    <p>P150 OFF SHIPPING ON MIN. PURCHASE OF P1500</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Chat Button -->
    <button class="chat-button">
        <i class="fas fa-comment"></i>
    </button>

    <div id="footer"></div>
  
    <!-- JAVASCRIPT -->
    <script src="products.js" type="module"></script>
    <script src="productPage.js" type="module"></script>
    <script>
        // Load the navbar
        fetch('../includes/navbar.html')
          .then(res => res.text())
          .then(data => document.getElementById('navbar').innerHTML = data);
      
        // Load the footer
        fetch('../includes/footer.html')
          .then(res => res.text())
          .then(data => document.getElementById('footer').innerHTML = data);
    </script>
</body>
</html>
